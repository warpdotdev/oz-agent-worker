nameOverride: ""
fullnameOverride: ""

image:
  repository: warpdotdev/oz-agent-worker
  # Set this explicitly to a published immutable worker image tag for each
  # install, e.g. v2026-06-01-10-09-37. Avoid using the mutable `latest` tag for
  # production self-hosted workers.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

warp:
  apiKeySecret:
    create: false
    name: oz-agent-worker
    key: WARP_API_KEY
    value: ""
  webSocketURL: wss://oz.warp.dev/api/v1/selfhosted/worker/ws
  serverRootURL: https://app.warp.dev

worker:
  workerId: ""
  logLevel: info
  cleanup: true
  maxConcurrentTasks: 0
  idleOnComplete: ""
  extraArgs: []
  extraEnv: []
  deploymentAnnotations: {}
  podAnnotations: {}
  podLabels: {}
  # Bounded grace period for worker pod termination. The Kubernetes backend
  # preserves active task Jobs when the worker pod is disrupted, so this only
  # needs to cover WebSocket close and metrics shutdown.
  terminationGracePeriodSeconds: 30
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # Liveness probe for the long-lived worker process. The default checks that
  # PID 1 is still running. Override with an httpGet probe if you add a health
  # endpoint to the worker.
  livenessProbe:
    exec:
      command: ["/bin/sh", "-c", "kill -0 1"]
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  # Conservative starting requests for the long-lived worker Deployment.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

kubernetesBackend:
  namespace: ""
  defaultImage: ""
  imagePullPolicy: IfNotPresent
  useImageVolumes: false
  preflightImage: ""
  sidecarImage: ""
  setupCommand: ""
  teardownCommand: ""
  extraLabels: {}
  extraAnnotations: {}
  # Hard wall-clock cap on how long a single task Job (and its pod) may run
  # before Kubernetes terminates it and marks the Job failed with a
  # DeadlineExceeded condition. This is a safety backstop against tasks whose
  # process never exits, so worker pods cannot linger indefinitely.
  # Defaults to 8h (28800s); set to null to disable the cap.
  activeDeadlineSeconds: 28800
  # How long finished task Jobs that the worker leaves in place are retained before
  # the Kubernetes Job TTL controller deletes them (and their pods). This covers
  # failed task Jobs, which are kept for post-mortem debugging, and Jobs orphaned by
  # worker disruption.
  #
  # A successful task Job is deleted by the worker at its execution's cleanup-grace
  # deadline (task idle_timeout_minutes, then worker.idleOnComplete, then the Oz
  # default) rather than at task completion, so its logs remain readable for a debug
  # archive. Keep this TTL at least as long as the effective grace: if the controller
  # deletes the pods first, a debug archive collected for that run is partial.
  # Defaults to 24h (86400s). When worker.cleanup=false the worker sets no TTL, so
  # these Jobs remain indefinitely.
  ttlSecondsAfterFinished: 86400
  workspaceSizeLimit: ""
  unschedulableTimeout: "30s"
  # Optional: raw Kubernetes PodSpec YAML for task Jobs. Configure task-pod
  # scheduling, serviceAccountName, imagePullSecrets, resources, and env here
  # using standard K8s syntax (e.g. containers[].env with valueFrom.secretKeyRef).
  # Note: when a run's runner specifies an instance shape, the worker sets the task
  # container's CPU/memory requests and limits from that shape per run, overriding any
  # matching resources set on the "task" container here (other entries are preserved).
  podTemplate: {}
  # Optional: cpu/memory requests and limits applied to the startup preflight
  # Job containers. When omitted the worker applies default resource constraints.
  # Example:
  #   preflightResources:
  #     requests:
  #       cpu: 10m
  #       memory: 16Mi
  #     limits:
  #       cpu: 100m
  #       memory: 64Mi
  preflightResources: {}

# Bounds for debug-archive log capture. The worker uses this space for
# direct-execution output captures and for the request-scoped snapshot it
# uploads; Docker and Kubernetes executions read provider logs on demand and
# keep nothing here.
#
# There is deliberately no retention duration: how long an execution's logs stay
# retrievable is the existing idle-on-complete cleanup grace (task
# `idle_timeout_minutes`, then `worker.idleOnComplete`, then the Oz default).
debugLogCapture:
  # Mounts a dedicated ephemeral volume for the capture root. Disable only if
  # the container filesystem already provides suitable scratch space.
  enabled: true
  # Size of the ephemeral volume. Keep it at or above maxTotalBytes so the
  # worker's own accounting, not the volume, is the binding limit.
  sizeLimit: 1Gi
  # Mount path for the capture volume, used as the worker's capture root.
  directory: /var/lib/oz/debug-logs
  # Process-local disk budget shared by captures and request snapshots.
  maxTotalBytes: 1073741824
  # Per-execution retention bound. May not exceed the protocol's 64 MiB ceiling.
  maxExecutionBytes: 67108864
  # Concurrent snapshot/upload handlers per worker process.
  maxConcurrentUploads: 2

# Metrics export uses the OpenTelemetry autoexport package, so the operator
# selects the exporter via standard OpenTelemetry environment variables. When
# `metrics.enabled` is false the worker emits no metrics, matching the
# pre-existing behavior.
metrics:
  enabled: false
  # Exporter to enable. Supported: prometheus | otlp | console | none.
  # When set to prometheus, the worker exposes /metrics on `metrics.port`.
  # When set to otlp, configure OTEL_EXPORTER_OTLP_ENDPOINT (and friends) via
  # `metrics.extraEnv` below.
  exporter: prometheus
  # Port served by the embedded Prometheus exporter. Ignored for otlp/console.
  port: 9464
  # Extra environment variables forwarded to the worker container, e.g. to
  # configure the OTLP endpoint:
  #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #     value: http://otel-collector.observability.svc:4318
  extraEnv: []
  service:
    create: true
    type: ClusterIP
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9464"
      prometheus.io/path: "/metrics"
  # Optional Prometheus Operator PodMonitor for clusters that prefer
  # PodMonitor/ServiceMonitor over scrape annotations. Disabled by default to
  # avoid requiring monitoring.coreos.com CRDs at install time.
  podMonitor:
    create: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
