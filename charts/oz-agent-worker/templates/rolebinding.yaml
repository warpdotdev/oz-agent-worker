{{- /* Bind task Job/Pod Role only when the kubernetes backend is selected. */ -}}
{{- if and .Values.rbac.create (eq (include "oz-agent-worker.backendType" .) "kubernetes") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oz-agent-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oz-agent-worker.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oz-agent-worker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oz-agent-worker.fullname" . }}
{{- end }}
