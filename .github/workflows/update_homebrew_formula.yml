name: Update Homebrew formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish to Homebrew
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to publish to Homebrew
        required: true
        type: string
    secrets:
      WARP_WORKFLOWS_APP_PRIVATE_KEY:
        required: true

permissions: {}
concurrency:
  group: update-homebrew-formula-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  update-formula:
    runs-on: namespace-profile-ubuntu-small
    steps:
      - name: Mint homebrew-warp token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WARP_WORKFLOWS_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARP_WORKFLOWS_APP_PRIVATE_KEY }}
          owner: warpdotdev
          repositories: homebrew-warp
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          brew-gh-api-token: ${{ steps.app_token.outputs.token }}

      - name: Tap Homebrew repository
        run: brew tap warpdotdev/warp

      - name: Trust Homebrew repository
        run: brew trust warpdotdev/warp

      - name: Configure git identity for the app bot
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq .id)"
          git config --global user.name "${bot_login}"
          git config --global user.email "${bot_id}+${bot_login}@users.noreply.github.com"

      - name: Wait for livecheck to observe release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Unexpected release tag: ${RELEASE_TAG}"
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          for attempt in 1 2 3 4 5; do
            latest_version="$(brew livecheck \
              --quiet \
              --json \
              --formula \
              warpdotdev/warp/oz-agent-worker |
              jq -r '.[0].version.latest')"
            if [[ "${latest_version}" == "${expected_version}" ]]; then
              exit 0
            fi

            echo "Livecheck returned ${latest_version}; waiting for ${expected_version}."
            if (( attempt < 5 )); then
              sleep "$((attempt * 5))"
            fi
          done

          echo "::error::Livecheck did not observe release ${RELEASE_TAG}."
          exit 1

      - name: Open version bump pull request
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app_token.outputs.token }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew bump --open-pr --no-fork --formula warpdotdev/warp/oz-agent-worker
